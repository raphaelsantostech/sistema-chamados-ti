
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Chamados de TI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Sistema de Chamados de TI</h1>
        <p>Gerenciamento de solicitações de suporte técnico</p>
    </header>

    <main>
        <section class="painel">
            <h2>Painel de Chamados</h2>
            <p>Acompanhe as solicitações de suporte técnico.</p>

            <div class="indicadores">

                <div class="card">
                    <h3>Total de Chamados</h3>
                    <span id="totalChamados">0</span>
                </div>

                <div class="card">
                    <h3>Chamados Abertos</h3>
                    <span id="chamadosAbertos">0</span>
                </div>

                <div class="card">
                    <h3>Em Andamento</h3>
                    <span id="chamadosAndamento">0</span>
                </div>

                <div class="card">
                    <h3>Concluídos</h3>
                    <span id="chamadosConcluidos">0</span>
                </div>

            </div>
        </section>
        
    </main>

    <script src="script.js"></script>
</body>
</html>
